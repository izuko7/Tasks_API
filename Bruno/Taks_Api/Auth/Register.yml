info:
  name: Register
  type: http
  seq: 1

http:
  method: POST
  url: "{{base_url}}/api/auth/sign-up/email"
  body:
    type: json
    data: |-
      {
        "email": "hacker@test.com",
        "password": "motdepasse123",
        "name": "Autre User"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        bru.setEnvVar("token", res.getBody().token);
        bru.setEnvVar("userId", res.getBody().user.id);
    - type: tests
      code: |-
        test("statut 200", function () {
          expect(res.getStatus()).to.equal(200);
        });

        test("token présent", function () {
          expect(res.getBody().token).to.be.a("string");
        });

        test("email correspond à la requête", function () {
          const requestBody = req.getBody();
          expect(res.getBody().user.email).to.equal(requestBody.email);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
