info:
  name: Find All Tasks
  type: http
  seq: 2

http:
  method: GET
  url: "{{base_url}}/tasks"
  headers:
    - name: Authorization
      value: Bearer {{token}}
  body:
    type: json
    data: ""
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("statut 200", function () {
          expect(res.getStatus()).to.equal(200);
        });

        test("réponse est un tableau", function () {
          expect(res.getBody()).to.be.an("array");
        });

        test("contient au moins une tâche", function () {
          expect(res.getBody().length).to.be.above(0);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
